server:
  port: 8081
  servlet:
    session:
      cookie:
        max-age: 7d
spring:
  session:
    store-type: redis
    timeout: 7d

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    # я вынес это в разные application, но моё решение с переменной localhost мне кажется изящнее
    url: jdbc:postgresql://${LOCALHOST:mydb}:5432/cloud_db
    username: ${DB_LOGIN}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
  jpa:
    show_sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  minio:
    endpoint: http://${LOCALHOST:minio}:9010
    access-key: admin
    secret-key: ${MINIO_PASSWORD:admin123}
    bucket: user-files


  data:
    redis:
      host: ${LOCALHOST:redis}
      port: 6379