
# этот файл я запускаю дома
services:
  db:
    image: postgres:16
    container_name: mydb
    environment:
      POSTGRES_DB: cloud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mydb" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
      args:
        NGINX_ENV: .dev
    ports:
      - "80:80"

  app-cloud:
    container_name: myapp
    build: .
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8081"

  redis:
    container_name: redis
    image: redis:8
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Используемый образ Docker. Рекомендуется указывать конкретный тег для стабильности.
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: s3
    command: server /data --address ":9010" --console-address ":9011"
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}

    ports:
      - "9010:9010" # API port
      - "9011:9011" # Console port
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 1024m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9010/minio/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



volumes:
  pgdata:
  redis-data:
  minio-data:
